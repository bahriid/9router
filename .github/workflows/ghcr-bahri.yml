name: GHCR image (bahri)

# Builds this fork for the home server: the upstream fix branch plus this workflow.
on:
  push:
    branches: [bahri]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/bahriid/9router:latest
            ghcr.io/bahriid/9router:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
